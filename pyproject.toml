[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-repair-posttraining"
version = "0.1.0"
description = "Auditable repository-level coding agent post-training with mini-SWE-agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["mini-swe-agent==2.4.6"]

[project.optional-dependencies]
client = ["transformers==5.17.0", "requests>=2.32"]
train = ["unsloth==2026.11.3", "transformers==5.17.0", "peft", "safetensors", "torch"]
serve = ["vllm==0.33.0"]
test = ["pytest>=8,<10"]

[project.scripts]
repairlab = "repairlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
